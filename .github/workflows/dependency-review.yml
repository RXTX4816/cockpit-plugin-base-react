name: Dependency Review

on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high or critical severity vulnerabilities
          fail-on-severity: high
          # Post a summary comment on the pull request
          comment-summary-in-pr: always
          # Allow only OSI-approved permissive licenses (replaces deprecated deny-licenses)
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, CC0-1.0
          # Exclude workflow files — GitHub Actions are not npm packages and
          # produce spurious "unknown license" warnings when scanned
          config-file: ".github/dependency-review-config.yml"
