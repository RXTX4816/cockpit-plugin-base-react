name: Bug Report
description: Report a bug in cockpit-plugin-base-react
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: dropdown
    id: affected-repo
    attributes:
      label: Affected repository
      description: Which repository does this bug affect?
      options:
        - cockpit-plugin-base-react (this repo)
        - cockpit-compose
        - cockpit-caddy
        - Multiple repositories
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or branch
      description: Which version or branch of cockpit-plugin-base-react is affected?
      placeholder: "e.g. 1.2.3 or main"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include error messages or stack traces if available.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Install @rxtx4816/cockpit-plugin-base-react@x.y.z
        2. ...
    validations:
      required: true

  - type: dropdown
    id: downstream-followup
    attributes:
      label: Downstream follow-up required?
      description: Does fixing this require coordinated changes in downstream repos?
      options:
        - "No"
        - "Yes — cockpit-compose"
        - "Yes — cockpit-caddy"
        - "Yes — both"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant (screenshots, links, environment details)?
