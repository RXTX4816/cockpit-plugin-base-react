name: Visual Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/**"
      - "src/systemd/**"
      - "src/visual/**"
      - "playwright.config.visual.ts"

permissions:
  contents: read

jobs:
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned to the same Playwright Docker image used to generate the committed
    # baselines (src/visual/__screenshots__/) — font rendering/anti-aliasing
    # differs enough between environments (even different Linux distros) that
    # baselines generated outside this exact image will fail here. When
    # bumping the @playwright/test version, update this tag to match and
    # regenerate baselines via the same image (see docs/wiki/Testing.md).
    #
    # @playwright/test is pinned to this exact version in package.json (no ^) so
    # a dependency bump can't quietly move ahead of the image; the guard step
    # below fails loudly with instructions if the two ever diverge.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check Playwright matches the container image
        run: |
          image_version=1.61.1
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$image_version" ]; then
            echo "::error::@playwright/test is $installed but this job runs in the" \
                 "mcr.microsoft.com/playwright:v${image_version}-noble image."
            echo "The baselines in src/visual/__screenshots__/ were generated in that image."
            echo "To bump: update the container image tag here, pin the same exact version"
            echo "in package.json, and regenerate the baselines in the new image"
            echo "(npm run test:visual:update). See docs/wiki/Testing.md."
            exit 1
          fi

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: playwright-report/
          retention-days: 14
