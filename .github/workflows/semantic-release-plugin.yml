name: Semantic Release (reusable)

# Tags a CI-verified commit on main with the next semantic version, behind a
# manual approval. The calling repo triggers this after its CI succeeds on a
# push to main (see docs/wiki/CI-CD.md for the caller template), so every
# merged commit gets a pending "Release" run that does nothing until the
# maintainer approves the `release` environment's deployment.
#
# The `release` environment MUST exist in the calling repo with the
# maintainer as required reviewer — GitHub silently creates an unprotected
# environment on first use otherwise. The verify job refuses to continue if
# it has no required-reviewer rule.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to release. Must be on main and have a successful CI run.
        type: string
        required: true
      ci-workflow:
        description: Workflow file whose successful push run on `sha` gates the release
        type: string
        default: ci.yml
      environment:
        description: Environment holding the required-reviewer rule
        type: string
        default: release
      initial_version:
        description: Deprecated, kept so older callers still validate. Used only when no tag exists yet.
        type: string
        default: v0.1.0
    secrets:
      RELEASE_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify and determine version
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.version.outputs.next_version }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Require a protected release environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          RULES=$(gh api "repos/$REPO/environments/$ENVIRONMENT" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
          if [ "$RULES" = "0" ]; then
            echo "::error::Environment '$ENVIRONMENT' is missing or has no required reviewers. Refusing to release without a manual approval gate."
            exit 1
          fi

      - name: Require a successful CI run on this commit
        env:
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          OK=$(gh api "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$SHA&event=push&branch=main&status=success&per_page=1" \
            --jq '.total_count')
          if [ "$OK" = "0" ]; then
            echo "::error::No successful '$CI_WORKFLOW' push run on main for $SHA."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Require the commit to be on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main."
            exit 1
          fi

      - name: Determine next version
        id: version
        env:
          INITIAL_VERSION: ${{ inputs.initial_version }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$SHA" 2>/dev/null || echo "NONE")
          echo "Last tag: $LAST_TAG"

          if [ "$LAST_TAG" = "NONE" ]; then
            NEXT_VERSION="$INITIAL_VERSION"
            CHANGE_TYPE="initial"
          else
            # Subjects only, for the feat/fix classification.
            SUBJECTS=$(git log "${LAST_TAG}..${SHA}" --format='%s')
            # Commit bodies (no subject), for the breaking-change footer. Matched
            # only when it starts a line, per Conventional Commits — a prose
            # mention of the phrase mid-sentence must NOT trigger a major bump.
            BODIES=$(git log "${LAST_TAG}..${SHA}" --format='%b')

            if [ -z "$SUBJECTS" ]; then
              echo "No commits since $LAST_TAG. Nothing to release."
              echo "### Nothing to release — $SHA is already tagged $LAST_TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            MAJOR=$(echo "$LAST_TAG" | cut -d. -f1 | sed 's/v//')
            MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | cut -d. -f3 | cut -d- -f1)

            # Breaking: a "!" before the ":" in a Conventional Commit header
            # (feat!:, chore(scope)!:), OR a "BREAKING CHANGE:" / "BREAKING-CHANGE:"
            # footer at the start of a body line.
            if echo "$SUBJECTS" | grep -qE "^[a-z]+(\([^)]+\))?!:" \
               || echo "$BODIES" | grep -qE "^BREAKING[ -]CHANGE: "; then
              NEXT_VERSION="v$((MAJOR + 1)).0.0"
              CHANGE_TYPE="major"
            elif echo "$SUBJECTS" | grep -qE "^feat(\([^)]+\))?:"; then
              NEXT_VERSION="v${MAJOR}.$((MINOR + 1)).0"
              CHANGE_TYPE="minor"
            else
              NEXT_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              CHANGE_TYPE="patch"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/$NEXT_VERSION" >/dev/null; then
            echo "::error::Tag $NEXT_VERSION already exists."
            exit 1
          fi

          echo "Next version: $NEXT_VERSION ($CHANGE_TYPE bump)"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Approve to release \`$NEXT_VERSION\` ($CHANGE_TYPE)"
            echo
            echo "Commit \`$SHA\`, since \`$LAST_TAG\`:"
            echo
            if [ "$LAST_TAG" != "NONE" ]; then
              git log "${LAST_TAG}..${SHA}" --format='- %s'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag release
    needs: verify
    if: needs.verify.outputs.next_version != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Create tag
        env:
          NEXT_VERSION: ${{ needs.verify.outputs.next_version }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # RELEASE_TOKEN (a PAT) rather than GITHUB_TOKEN, so the tag push
          # triggers the caller's release workflow.
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/${NEXT_VERSION}" \
            -f sha="${SHA}"
          echo "Created tag $NEXT_VERSION on $SHA — the release workflow will trigger automatically"
