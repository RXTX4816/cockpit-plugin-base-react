name: Packaging CI (reusable)

on:
  workflow_call:
    inputs:
      plugin-name:
        description: "Plugin name (e.g. cockpit-caddy)"
        required: true
        type: string
      spec-file:
        description: "RPM spec file path (e.g. cockpit-caddy.spec)"
        required: true
        type: string
      aur-pkgname:
        description: "Arch Linux AUR package name"
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false

jobs:
  rpm:
    name: RPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout cockpit-plugin-base-react (file: dependency)
        uses: actions/checkout@v7
        with:
          repository: RXTX4816/cockpit-plugin-base-react
          path: ../cockpit-plugin-base-react
          token: ${{ github.token }}
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@rxtx4816"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Build tarball
        run: |
          mkdir -p ${{ inputs.plugin-name }}
          cp src/main.js src/main.css src/manifest.json src/index.html README.md ${{ inputs.plugin-name }}/
          tar -czf ${{ inputs.plugin-name }}-0.0.0.tar.gz ${{ inputs.plugin-name }}/
      - name: Install RPM tools
        run: sudo apt-get install -y rpm
      - name: Build RPM
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp ${{ inputs.plugin-name }}-0.0.0.tar.gz rpmbuild/SOURCES/
          cp ${{ inputs.spec-file }} rpmbuild/SPECS/
          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "version 0.0.0" \
            -bb rpmbuild/SPECS/${{ inputs.spec-file }}
      - name: Verify RPM contents
        run: |
          RPM=$(find rpmbuild/RPMS -name "*.rpm" | head -1)
          rpm -qlp "$RPM" | grep -q "${{ inputs.plugin-name }}/main.js"
          rpm -qlp "$RPM" | grep -q "${{ inputs.plugin-name }}/manifest.json"

  deb:
    name: DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout cockpit-plugin-base-react (file: dependency)
        uses: actions/checkout@v7
        with:
          repository: RXTX4816/cockpit-plugin-base-react
          path: ../cockpit-plugin-base-react
          token: ${{ github.token }}
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@rxtx4816"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Build tarball
        run: |
          mkdir -p ${{ inputs.plugin-name }}
          cp src/main.js src/main.css src/manifest.json src/index.html README.md ${{ inputs.plugin-name }}/
          tar -czf ${{ inputs.plugin-name }}-0.0.0.tar.gz ${{ inputs.plugin-name }}/
      - name: Install DEB tools
        run: sudo apt-get install -y devscripts debhelper dpkg-dev build-essential
      - name: Build DEB
        run: |
          mkdir -p ${{ inputs.plugin-name }}-0.0.0
          tar -xzf ${{ inputs.plugin-name }}-0.0.0.tar.gz -C ${{ inputs.plugin-name }}-0.0.0
          cp -r debian ${{ inputs.plugin-name }}-0.0.0/
          printf '%s (0.0.0-1) unstable; urgency=low\n\n  * CI check.\n\n -- RXTX4816 <RXTX4816@proton.me>  %s\n' \
            "${{ inputs.plugin-name }}" "$(date -R)" > ${{ inputs.plugin-name }}-0.0.0/debian/changelog
          cd ${{ inputs.plugin-name }}-0.0.0
          dpkg-buildpackage -us -uc -b
      - name: Verify DEB contents
        run: |
          DEB=$(find . -maxdepth 1 -name "*.deb" | head -1)
          dpkg-deb -c "$DEB" | grep -q "${{ inputs.plugin-name }}/main.js"
          dpkg-deb -c "$DEB" | grep -q "${{ inputs.plugin-name }}/manifest.json"

  arch:
    name: Arch PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout cockpit-plugin-base-react (file: dependency)
        uses: actions/checkout@v7
        with:
          repository: RXTX4816/cockpit-plugin-base-react
          path: ../cockpit-plugin-base-react
          token: ${{ github.token }}
      - name: Install build tools
        run: pacman -Syu --noconfirm base-devel nodejs npm
      - name: Build plugin
        run: |
          npm ci
          npm run build
          mkdir -p ${{ inputs.plugin-name }}
          cp src/main.js src/main.css src/manifest.json src/index.html README.md ${{ inputs.plugin-name }}/
          tar -czf ${{ inputs.plugin-name }}-0.0.0.tar.gz ${{ inputs.plugin-name }}/
      - name: Patch PKGBUILD for local build
        run: |
          sed -i 's/^pkgver=.*/pkgver=0.0.0/' PKGBUILD
          sed -i 's|source=.*|source=("${{ inputs.plugin-name }}-0.0.0.tar.gz")|' PKGBUILD
          sed -i "s/sha256sums=.*/sha256sums=('$(sha256sum ${{ inputs.plugin-name }}-0.0.0.tar.gz | awk '{print $1}')')/" PKGBUILD
      - name: Build package
        run: |
          useradd builder
          chown -R builder .
          su builder -c "cd $(pwd) && makepkg --nodeps --noconfirm"
      - name: Verify package contents
        run: |
          PKG=$(find . -name "*.pkg.tar.*" | head -1)
          tar -tf "$PKG" | grep -q "usr/share/cockpit/${{ inputs.plugin-name }}/main.js"
