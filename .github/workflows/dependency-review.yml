name: Dependency Review

on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    uses: ./.github/workflows/dependency-review-plugin.yml
    with:
      fail-on-severity: high
      # allow-licenses intentionally not overridden — inherit the reusable
      # workflow's default so this repo and its consumer plugins share one policy.
    secrets: inherit
