name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write  # required for npm provenance

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          scope: "@rxtx4816"

      - run: npm ci

      - run: npm run typecheck

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          npm pkg set version="${VERSION#v}"
          npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_CLEAN="${VERSION#v}"

          CHANGELOG=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${VERSION}" \
            --jq '.body' 2>/dev/null || echo "")

          {
            echo "## Install / Upgrade"
            echo ""
            printf '```bash\nnpm install @rxtx4816/cockpit-plugin-base-react@%s\n```\n' "${VERSION_CLEAN}"
            echo ""
            printf '```json\n"@rxtx4816/cockpit-plugin-base-react": "^%s"\n```\n' "${VERSION_CLEAN}"
            echo ""
            echo "${CHANGELOG}"
          } > release-notes.md

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file release-notes.md
