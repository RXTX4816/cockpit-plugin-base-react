name: i18n Coverage Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  i18n-check:
    name: i18n Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run i18n coverage check
        run: node scripts/i18n-coverage.mjs
        # The script exits with a non-zero code when coverage falls below the
        # threshold defined in the script, failing the workflow automatically.
        # To change from a blocking check to a warning-only check, replace this
        # step with: continue-on-error: true
