# Dependency review configuration
# https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/configuring-dependency-review

fail-on-severity: high
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Unlicense
  - CC0-1.0

# GitHub Actions referenced in workflow files are detected as dependencies but
# have null license metadata — they are not npm packages. Allowlist them here
# to suppress spurious "unknown license" warnings.
# Add any new actions introduced to .github/workflows/ in the same format.
allow-dependencies-licenses:
  - pkg:githubactions/actions/checkout
  - pkg:githubactions/actions/setup-node
  - pkg:githubactions/actions/cache
  - pkg:githubactions/actions/dependency-review-action
  - pkg:githubactions/github/codeql-action
  - pkg:githubactions/actions/github-script
