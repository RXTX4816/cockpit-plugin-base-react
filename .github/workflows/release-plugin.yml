name: Release (reusable)

on:
  workflow_call:
    inputs:
      plugin-name:
        description: "Plugin name (e.g. cockpit-caddy)"
        required: true
        type: string
      spec-file:
        description: "RPM spec filename (e.g. cockpit-caddy.spec)"
        required: true
        type: string
      aur-pkgname:
        description: "AUR package name (e.g. cockpit-caddy)"
        required: true
        type: string
      maintainer-name:
        description: "Maintainer name for DEB changelog"
        required: true
        type: string
      maintainer-email:
        description: "Maintainer email for DEB changelog"
        required: true
        type: string
    secrets:
      AUR_SSH_KEY:
        required: true
      RELEASE_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Get version from tag
        id: version
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CLEAN=${VERSION#v}" >> "$GITHUB_ENV"
          echo "version_clean=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Set version in package.json
        run: npm pkg set version="${VERSION_CLEAN}"

      - run: npm run build

      # ── Tarball ─────────────────────────────────────────────────────────
      - name: Package release tarball
        run: |
          mkdir -p ${{ inputs.plugin-name }}
          cp src/main.js src/main.css src/manifest.json src/index.html README.md ${{ inputs.plugin-name }}/
          tar -czf "${{ inputs.plugin-name }}-${VERSION_CLEAN}.tar.gz" ${{ inputs.plugin-name }}/
          sha256sum "${{ inputs.plugin-name }}-${VERSION_CLEAN}.tar.gz" > "${{ inputs.plugin-name }}-${VERSION_CLEAN}.tar.gz.sha256"
          rm -rf ${{ inputs.plugin-name }}

      # ── RPM ─────────────────────────────────────────────────────────────
      - name: Install RPM build tools
        run: sudo apt-get install -y rpm

      - name: Build RPM
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "${{ inputs.plugin-name }}-${VERSION_CLEAN}.tar.gz" rpmbuild/SOURCES/
          cp ${{ inputs.spec-file }} rpmbuild/SPECS/
          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "version ${VERSION_CLEAN}" \
            -bb "rpmbuild/SPECS/${{ inputs.spec-file }}"

      # ── DEB ─────────────────────────────────────────────────────────────
      - name: Install DEB build tools
        run: sudo apt-get install -y devscripts debhelper dpkg-dev build-essential

      - name: Build DEB
        run: |
          mkdir -p "${{ inputs.plugin-name }}-${VERSION_CLEAN}"
          tar -xzf "${{ inputs.plugin-name }}-${VERSION_CLEAN}.tar.gz" \
              -C "${{ inputs.plugin-name }}-${VERSION_CLEAN}"
          cp -r debian "${{ inputs.plugin-name }}-${VERSION_CLEAN}/"
          printf '%s (%s-1) unstable; urgency=low\n\n  * Release %s.\n\n -- %s <%s>  %s\n' \
            "${{ inputs.plugin-name }}" "${VERSION_CLEAN}" "${VERSION}" \
            "${{ inputs.maintainer-name }}" "${{ inputs.maintainer-email }}" \
            "$(date -R)" \
            > "${{ inputs.plugin-name }}-${VERSION_CLEAN}/debian/changelog"
          cd "${{ inputs.plugin-name }}-${VERSION_CLEAN}"
          dpkg-buildpackage -us -uc -b

      # ── Checksums and stable alias assets ───────────────────────────────
      - name: Generate checksums and create latest aliases
        run: |
          RPM=$(find rpmbuild/RPMS -name "*.rpm" | head -1)
          DEB=$(find . -maxdepth 1 -name "*.deb" | head -1)
          TARBALL="${{ inputs.plugin-name }}-${VERSION_CLEAN}.tar.gz"

          # sha256 for versioned rpm and deb
          sha256sum "${RPM}" > "${RPM}.sha256"
          sha256sum "${DEB}" > "${DEB}.sha256"

          # stable alias copies
          LATEST_RPM="${{ inputs.plugin-name }}-latest.rpm"
          LATEST_DEB="${{ inputs.plugin-name }}-latest.deb"
          LATEST_TAR="${{ inputs.plugin-name }}-latest.tar.gz"
          cp "${RPM}" "${LATEST_RPM}"
          cp "${DEB}" "${LATEST_DEB}"
          cp "${TARBALL}" "${LATEST_TAR}"

          # sha256 for stable alias copies
          sha256sum "${LATEST_RPM}" > "${LATEST_RPM}.sha256"
          sha256sum "${LATEST_DEB}" > "${LATEST_DEB}.sha256"
          sha256sum "${LATEST_TAR}" > "${LATEST_TAR}.sha256"

          # export paths for upload step
          echo "RPM=${RPM}" >> "$GITHUB_ENV"
          echo "DEB=${DEB}" >> "$GITHUB_ENV"
          echo "LATEST_RPM=${LATEST_RPM}" >> "$GITHUB_ENV"
          echo "LATEST_DEB=${LATEST_DEB}" >> "$GITHUB_ENV"
          echo "LATEST_TAR=${LATEST_TAR}" >> "$GITHUB_ENV"

      # ── Upload ──────────────────────────────────────────────────────────
      - name: Upload release assets
        run: |
          TARBALL="${{ inputs.plugin-name }}-${VERSION_CLEAN}.tar.gz"
          CHECKSUM="${TARBALL}.sha256"
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            "${TARBALL}"            "${CHECKSUM}" \
            "${RPM}"                "${RPM}.sha256" \
            "${DEB}"                "${DEB}.sha256" \
            "${LATEST_TAR}"         "${LATEST_TAR}.sha256" \
            "${LATEST_RPM}"         "${LATEST_RPM}.sha256" \
            "${LATEST_DEB}"         "${LATEST_DEB}.sha256" \
          || gh release upload "${VERSION}" \
            "${TARBALL}"            "${CHECKSUM}" \
            "${RPM}"                "${RPM}.sha256" \
            "${DEB}"                "${DEB}.sha256" \
            "${LATEST_TAR}"         "${LATEST_TAR}.sha256" \
            "${LATEST_RPM}"         "${LATEST_RPM}.sha256" \
            "${LATEST_DEB}"         "${LATEST_DEB}.sha256" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # ── AUR ─────────────────────────────────────────────────────────────
      - name: Update PKGBUILD
        run: |
          SHA256=$(cat "${{ inputs.plugin-name }}-${VERSION_CLEAN}.tar.gz.sha256" | awk '{print $1}')
          sed -i "s/^pkgver=.*/pkgver=${VERSION_CLEAN}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=('.*')/sha256sums=('${SHA256}')/" PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: ${{ inputs.aur-pkgname }}
          pkgbuild: ./PKGBUILD
          commit_username: ${{ inputs.maintainer-name }}
          commit_email: ${{ inputs.maintainer-email }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version_clean }}"
          force_push: true
