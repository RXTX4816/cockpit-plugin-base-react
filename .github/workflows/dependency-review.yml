name: Dependency Review

on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    uses: ./.github/workflows/dependency-review-plugin.yml
    with:
      fail-on-severity: high
      allow-licenses: "MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, CC0-1.0"
    secrets: inherit
