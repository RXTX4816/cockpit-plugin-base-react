name: Semantic Release (reusable)

# Tags a CI-verified commit on main with the next semantic version. Releases
# are started by hand: the calling repo's semantic-release.yml only has a
# workflow_dispatch trigger (the "Run workflow" button, see docs/wiki/CI-CD.md
# for the caller template) and passes its `dry_run` input through.
#
# The verify job refuses any ref other than main, checks that the commit has a
# successful CI run, computes the next version and writes it, together with
# the commits since the last tag, to the run summary. With `dry_run` it stops
# there. Otherwise the release job creates the tag; it runs in the `release`
# environment, so any protection rules configured there (e.g. a required
# reviewer) still apply.

on:
  workflow_call:
    inputs:
      sha:
        description: >-
          Commit to release. Must be on main and have a successful CI run.
          Defaults to the commit the run was started on, i.e. the tip of main.
        type: string
        default: ''
      dry_run:
        description: Only compute and print the next version and changelog, do not tag
        type: boolean
        default: false
      ci-workflow:
        description: Workflow file whose successful push run on the commit gates the release
        type: string
        default: ci.yml
      environment:
        description: Environment the tagging job runs in
        type: string
        default: release
      initial_version:
        description: Deprecated, kept so older callers still validate. Used only when no tag exists yet.
        type: string
        default: v0.1.0
    secrets:
      RELEASE_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify and determine version
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.version.outputs.next_version }}
      sha: ${{ steps.sha.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are only made from main, this run was started on $REF."
            exit 1
          fi

      - name: Resolve commit
        id: sha
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Check the release environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          EVENT: ${{ github.event_name }}
        run: |
          RULES=$(gh api "repos/$REPO/environments/$ENVIRONMENT" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
          if [ "$RULES" = "0" ]; then
            # Callers still on the old automatic workflow_run trigger rely on
            # the reviewer as their only gate; a manual run is its own gate.
            if [ "$EVENT" = "workflow_run" ]; then
              echo "::error::Environment '$ENVIRONMENT' is missing or has no required reviewers. Refusing an automatic release without a manual approval gate."
              exit 1
            fi
            echo "::notice::Environment '$ENVIRONMENT' has no required reviewers; the tag is created without a further approval."
          fi

      - name: Require a successful CI run on this commit
        env:
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          OK=$(gh api "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$SHA&event=push&branch=main&status=success&per_page=1" \
            --jq '.total_count')
          if [ "$OK" = "0" ]; then
            echo "::error::No successful '$CI_WORKFLOW' push run on main for $SHA (yet). Wait for CI to finish on main, then start the release again."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0

      - name: Require the commit to be on main
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main."
            exit 1
          fi

      - name: Determine next version
        id: version
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ inputs.environment }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$SHA" 2>/dev/null || echo "NONE")
          echo "Last tag: $LAST_TAG"

          if [ "$LAST_TAG" = "NONE" ]; then
            RANGE="$SHA"
            NEXT_VERSION="$INITIAL_VERSION"
            CHANGE_TYPE="initial"
          else
            RANGE="${LAST_TAG}..${SHA}"
            # Subjects only, for the feat/fix classification.
            SUBJECTS=$(git log "$RANGE" --format='%s')
            # Commit bodies (no subject), for the breaking-change footer. Matched
            # only when it starts a line, per Conventional Commits — a prose
            # mention of the phrase mid-sentence must NOT trigger a major bump.
            BODIES=$(git log "$RANGE" --format='%b')

            if [ -z "$SUBJECTS" ]; then
              echo "No commits since $LAST_TAG. Nothing to release."
              echo "### Nothing to release — \`$SHA\` is already tagged \`$LAST_TAG\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            MAJOR=$(echo "$LAST_TAG" | cut -d. -f1 | sed 's/v//')
            MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | cut -d. -f3 | cut -d- -f1)

            # Breaking: a "!" before the ":" in a Conventional Commit header
            # (feat!:, chore(scope)!:), OR a "BREAKING CHANGE:" / "BREAKING-CHANGE:"
            # footer at the start of a body line.
            if echo "$SUBJECTS" | grep -qE "^[a-z]+(\([^)]+\))?!:" \
               || echo "$BODIES" | grep -qE "^BREAKING[ -]CHANGE: "; then
              NEXT_VERSION="v$((MAJOR + 1)).0.0"
              CHANGE_TYPE="major"
            elif echo "$SUBJECTS" | grep -qE "^feat(\([^)]+\))?:"; then
              NEXT_VERSION="v${MAJOR}.$((MINOR + 1)).0"
              CHANGE_TYPE="minor"
            else
              NEXT_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              CHANGE_TYPE="patch"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/$NEXT_VERSION" >/dev/null; then
            echo "::error::Tag $NEXT_VERSION already exists."
            exit 1
          fi

          CHANGELOG=$(git log "$RANGE" --format='- %s (%h)')
          echo "Next version: $NEXT_VERSION ($CHANGE_TYPE bump)"
          echo "Commits since $LAST_TAG:"
          echo "$CHANGELOG"

          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "### Dry run: next release would be \`$NEXT_VERSION\` ($CHANGE_TYPE)"
              echo
              echo "Nothing was tagged. Run the workflow again with *dry run* unchecked to release."
            else
              echo "### Releasing \`$NEXT_VERSION\` ($CHANGE_TYPE)"
              echo
              echo "The tag is created by the *Tag release* job in the \`$ENVIRONMENT\` environment."
            fi
            echo
            echo "Commit \`$SHA\`, commits since \`$LAST_TAG\`:"
            echo
            echo "$CHANGELOG"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" != "true" ]; then
            echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Tag release
    needs: verify
    if: needs.verify.outputs.next_version != '' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Create tag
        env:
          NEXT_VERSION: ${{ needs.verify.outputs.next_version }}
          SHA: ${{ needs.verify.outputs.sha }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # RELEASE_TOKEN (a PAT) rather than GITHUB_TOKEN, so the tag push
          # triggers the caller's release workflow.
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/${NEXT_VERSION}" \
            -f sha="${SHA}"
          echo "Created tag $NEXT_VERSION on $SHA — the release workflow will trigger automatically"
