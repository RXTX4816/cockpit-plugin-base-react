name: Publish to npm (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  id-token: write  # required for npm provenance (trusted publisher)

jobs:
  publish:
    name: Publish @rxtx4816/cockpit-plugin-base-react
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          scope: "@rxtx4816"

      - run: npm ci

      - name: Set version from tag
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          npm pkg set version="${VERSION#v}"

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
