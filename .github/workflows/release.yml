name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm trusted publishing: the job's OIDC identity is what authenticates the
  # publish (and signs provenance), so no npm token is stored anywhere.
  id-token: write

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          scope: "@rxtx4816"

      - run: npm ci

      - run: npm run typecheck

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10. Pinned to 11
      # rather than latest, and only for the publish itself, after `npm ci`.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # Authenticates through the trusted publisher configured on npmjs.com for this
      # repository and workflow file (release.yml). Renaming this file breaks that link.
      - name: Publish to npm
        run: |
          VERSION="${{ github.ref_name }}"
          npm pkg set version="${VERSION#v}"
          npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_CLEAN="${VERSION#v}"

          CHANGELOG=$(node scripts/release-notes.mjs --to "${VERSION}" 2>/dev/null \
            || gh api repos/${{ github.repository }}/releases/generate-notes \
                 -f tag_name="${VERSION}" --jq '.body' 2>/dev/null \
            || echo "")

          {
            echo "## Install / Upgrade"
            echo ""
            printf '```bash\nnpm install @rxtx4816/cockpit-plugin-base-react@%s\n```\n' "${VERSION_CLEAN}"
            echo ""
            printf '```json\n"@rxtx4816/cockpit-plugin-base-react": "^%s"\n```\n' "${VERSION_CLEAN}"
            echo ""
            echo "${CHANGELOG}"
          } > release-notes.md

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file release-notes.md
